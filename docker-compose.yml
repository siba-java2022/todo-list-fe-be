services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      args:
        API_PORT: ${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${API_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        WEB_PORT: ${WEB_PORT}
        WEB_HOSTNAME: ${WEB_HOSTNAME}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    environment:
      PORT: ${WEB_PORT}
      HOSTNAME: ${WEB_HOSTNAME}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      - api

volumes:
  postgres_data:
