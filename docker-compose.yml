services:
  api:
    build:
      context: ./backend
      args:
        API_PORT: ${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${API_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      NODE_ENV: ${NODE_ENV}
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        WEB_PORT: ${WEB_PORT}
        WEB_HOSTNAME: ${WEB_HOSTNAME}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    environment:
      PORT: ${WEB_PORT}
      HOSTNAME: ${WEB_HOSTNAME}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      - api
